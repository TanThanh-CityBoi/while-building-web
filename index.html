<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Defaults for crawlers that don't run JavaScript. Pages update title/description at runtime. -->
    <title>While Building</title>
    <meta
      name="description"
      content="A personal space where I document things I build, experiments I run, problems I solve, and lessons I learn along the way."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="While Building" />
    <meta property="og:title" content="While Building" />
    <meta
      property="og:description"
      content="A personal space where I document things I build, experiments I run, problems I solve, and lessons I learn along the way."
    />
    <!-- TODO: add og:url and og:image once the production domain and a share image exist. -->
    <meta name="twitter:card" content="summary" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
